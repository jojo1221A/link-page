<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YardenRGS</title>

<style>
:root {
    --purple: #a100ff;
    --purple2: #cf54ff;
    --bg: #030006;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    width: 100%;
    min-height: 100%;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #030006;
    color: white;
    overflow-x: hidden;
}

/* =========================
   STARS
========================= */

.stars,
.stars2 {
    position: fixed;
    inset: -100%;
    width: 300%;
    height: 300%;
    pointer-events: none;
    z-index: 0;
}

.stars {
    background-image:
        radial-gradient(circle, #fff 1px, transparent 1.5px),
        radial-gradient(circle, #c85cff 1px, transparent 1.5px),
        radial-gradient(circle, #8d00ff 1px, transparent 1.5px);

    background-size:
        145px 145px,
        205px 205px,
        285px 285px;

    background-position:
        0 0,
        50px 70px,
        120px 40px;

    animation: starsMove 30s linear infinite;
    opacity: .85;
}

.stars2 {
    background-image:
        radial-gradient(circle, #fff 1px, transparent 1.3px),
        radial-gradient(circle, #d879ff 1px, transparent 1.3px);

    background-size:
        190px 190px,
        320px 320px;

    background-position:
        80px 30px,
        20px 140px;

    animation: starsMove2 48s linear infinite;
    opacity: .4;
}

@keyframes starsMove {
    from {
        transform: translate(0, 0);
    }
    to {
        transform: translate(130px, 190px);
    }
}

@keyframes starsMove2 {
    from {
        transform: translate(0, 0);
    }
    to {
        transform: translate(-160px, 220px);
    }
}

/* =========================
   INTRO
========================= */

#intro {
    position: fixed;
    inset: 0;
    z-index: 9999;
    background:
        radial-gradient(
            circle at center,
            rgba(150, 0, 255, .18),
            transparent 32%
        ),
        #020003;

    display: flex;
    align-items: center;
    justify-content: center;

    transition:
        opacity 1s ease,
        visibility 1s ease;
}

#intro.hide {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}

.intro-stars {
    position: absolute;
    inset: 0;
    overflow: hidden;
}

.intro-stars span {
    position: absolute;
    width: 2px;
    height: 2px;
    border-radius: 50%;
    background: white;
    box-shadow: 0 0 6px #b900ff;
    animation: introStars 4s linear infinite;
}

@keyframes introStars {
    from {
        transform: translate(0, 0) scale(.5);
        opacity: .2;
    }

    50% {
        opacity: 1;
    }

    to {
        transform: translate(var(--tx), var(--ty)) scale(1.8);
        opacity: 0;
    }
}

/* Coin */

.coin {
    position: relative;
    width: 280px;
    height: 280px;

    display: flex;
    align-items: center;
    justify-content: center;

    animation:
        coinIntro 1s ease-out forwards,
        coinSpin 2.8s cubic-bezier(.2,.7,.2,1) 0.9s forwards;

    transform-style: preserve-3d;
}

.coin::before {
    content: "";
    position: absolute;
    inset: 0;

    border-radius: 50%;

    background:
        linear-gradient(
            135deg,
            #5a00aa,
            #d05cff,
            #7b00e8,
            #b33cff
        );

    box-shadow:
        0 0 18px rgba(180, 40, 255, .8),
        0 0 50px rgba(150, 0, 255, .45);

    z-index: -1;
}

.coin img {
    width: 94%;
    height: 94%;

    object-fit: cover;
    border-radius: 50%;

    background: #040006;

    border: 4px solid #b32cff;

    box-shadow:
        inset 0 0 20px rgba(255,255,255,.08),
        0 0 18px rgba(170,0,255,.5);

    backface-visibility: hidden;
}

@keyframes coinIntro {
    0% {
        transform: scale(.1);
        opacity: 0;
    }

    100% {
        transform: scale(1);
        opacity: 1;
    }
}

@keyframes coinSpin {
    0% {
        transform: rotateY(0deg);
    }

    30% {
        transform: rotateY(400deg);
    }

    70% {
        transform: rotateY(820deg);
    }

    100% {
        transform: rotateY(1080deg);
    }
}

/* =========================
   WEBSITE
========================= */

#site {
    position: relative;
    z-index: 2;

    min-height: 100vh;

    opacity: 0;
    transform: translateY(20px);

    transition:
        opacity 1s ease,
        transform 1s ease;

    padding: 50px 20px 35px;
}

#site.show {
    opacity: 1;
    transform: translateY(0);
}

.container {
    width: min(100%, 760px);
    margin: auto;
    text-align: center;
}

/* =========================
   LOGO
========================= */

.logo-wrap {
    width: 190px;
    height: 190px;
    margin: 0 auto 20px;

    border-radius: 50%;

    padding: 4px;

    background:
        linear-gradient(
            135deg,
            #6500ff,
            #dd69ff,
            #8500ff
        );

    box-shadow:
        0 0 20px rgba(170,0,255,.8),
        0 0 45px rgba(150,0,255,.3);
}

.logo {
    width: 100%;
    height: 100%;

    overflow: hidden;

    border-radius: 50%;

    background: #040006;
}

.logo img {
    width: 100%;
    height: 100%;

    object-fit: cover;
    display: block;
}

/* =========================
   TITLE
========================= */

h1 {
    font-size: clamp(42px, 8vw, 72px);
    font-weight: 900;
    margin-bottom: 8px;
    letter-spacing: -2px;
}

h1 span {
    color: var(--purple2);

    text-shadow:
        0 0 16px rgba(207,84,255,.5);
}

.subtitle {
    color: #d171ff;

    font-size: 14px;
    font-weight: 800;

    letter-spacing: 6px;

    margin-bottom: 18px;
}

.divider {
    width: 100px;
    height: 4px;

    margin: 0 auto 30px;

    border-radius: 20px;

    background: #ae00ff;

    box-shadow:
        0 0 10px #ae00ff,
        0 0 25px rgba(174,0,255,.7);
}

/* =========================
   LINKS
========================= */

.links {
    display: flex;
    flex-direction: column;

    gap: 16px;
}

.link {
    min-height: 84px;

    display: grid;

    grid-template-columns:
        70px
        1fr
        40px;

    align-items: center;

    padding: 0 20px;

    text-decoration: none;

    border-radius: 18px;

    background:
        rgba(3,0,8,.88);

    border: 2px solid currentColor;

    color: white;

    transition:
        transform .2s ease,
        box-shadow .2s ease,
        background .2s ease;
}

.link:hover {
    transform:
        translateY(-4px)
        scale(1.01);

    background:
        rgba(16,3,25,.95);
}

.icon {
    display: flex;
    align-items: center;
    justify-content: flex-start;
}

.icon svg {
    width: 37px;
    height: 37px;
    fill: currentColor;
}

.name {
    text-align: center;
    font-size: 22px;
    font-weight: 800;
}

.arrow {
    text-align: right;
    font-size: 32px;
}

/* =========================
   BRAND COLORS
========================= */

.kick {
    color: #53ff00;
}

.youtube {

}

.discord {
    color: #8c62ff;

.tiktok {

}

.twitch {
    color: #a64cff;
}

.instagram {
    color: #ff5a9d;
}

.paypal {
    color: #2899ff;
}

/* =========================
   FOOTER
========================= */

footer {
    margin-top: 32px;

    color: #777;

    font-size: 13px;
}

footer span {
    color: var(--purple2);
    font-weight: 800;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    #site {
        padding-top: 35px;
    }

    .logo-wrap {
        width: 150px;
        height: 150px;
    }

    .coin {
        width: 220px;
        height: 220px;
    }

        font-size: 11px;
        letter-spacing: 4px;
    }

    .link {

        grid-template-columns:
            54px
            1fr
            30px;

        padding: 0 14px;

        border-radius: 15px;
    }

    .icon svg {
        width: 30px;
        height: 30px;
    }

    .name {
        font-size: 18px;
    }

    .arrow {
        font-size: 27px;
    }
}
</style>
