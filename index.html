<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YardenRGS</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: #080808;
    color: white;
    display: flex;
    justify-content: center;
    overflow-x: hidden;
}

.container {
    width: 100%;
    max-width: 620px;
    padding: 45px 20px;
    text-align: center;
}

.profile {
    margin-bottom: 30px;
}

.logo {
    width: 110px;
    height: 110px;
    border-radius: 50%;
    margin: auto;
    background: linear-gradient(135deg, #222, #555);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    font-weight: 900;
    border: 3px solid #333;
    box-shadow: 0 0 30px rgba(255,255,255,0.08);
}

h1 {
    margin-top: 18px;
    font-size: 30px;
    font-weight: 800;
}

.username {
    color: #999;
    margin-top: 7px;
    font-size: 15px;
}

.links {
    display: flex;
    flex-direction: column;
    gap: 14px;
}

.link {
    height: 68px;
    border-radius: 16px;
    background: #151515;
    border: 1px solid #292929;
    color: white;
    text-decoration: none;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    font-size: 18px;
    font-weight: 700;
    transition: 0.2s;
}

.link:hover {
    transform: translateY(-3px);
    background: #202020;
    border-color: #444;
}

.icon {
    position: absolute;
    left: 22px;
    font-size: 25px;
}

footer {
    margin-top: 30px;
    color: #666;
    font-size: 13px;
}
</style>
</head>

<body>

<div class="container">

    <div class="profile">
        <div class="logo">YR</div>
        <h1>YardenRGS</h1>
        <div class="username">
