<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;

}

body{
    background:#000;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
    overflow-x:hidden;
}

/* =========================
   STAR WARS / HYPERSPACE
========================= */

#space{
    position:fixed;
    inset:0;
    overflow:hidden;
    z-index:0;
    background:
        radial-gradient(
            circle at center,
            #160024 0%,
            #050009 38%,
            #000 75%
        );
}

.star{
    position:absolute;
    left:50%;
    top:50%;

    width:2px;
    height:2px;

    background:white;
    border-radius:50%;

    box-shadow:
        0 0 5px white,
        0 0 12px #b400ff;

    transform-origin:center;

    animation:
        hyperspace var(--duration) linear infinite;

    animation-delay:var(--delay);
}

@keyframes hyperspace{

    0%{
        transform:
            translate(-50%,-50%)
            rotate(var(--angle))
            translateX(10px)
            scaleX(.5);

        opacity:0;
    }

    10%{
        opacity:1;
    }

    100%{
        transform:
            translate(-50%,-50%)
            rotate(var(--angle))
            translateX(1100px)
            scaleX(8);

        opacity:0;
    }
}

/* Purple glow */

.spaceGlow{
    position:fixed;
    left:50%;
    top:50%;

    width:800px;
    height:800px;

    transform:translate(-50%,-50%);

    background:
        radial-gradient(
            circle,
            rgba(150,0,255,.25),
            rgba(80,0,150,.1) 35%,
            transparent 70%
        );

    filter:blur(40px);

    z-index:1;
    pointer-events:none;
}

/* =========================
   PAGE
========================= */

.page{
    position:relative;
    z-index:5;

    width:min(700px,94%);
    margin:auto;

    padding:35px 0 30px;

    text-align:center;
}

/* =========================
   LOGO
========================= */

.logo{
    width:155px;
    height:155px;

    margin:0 auto 8px;

    border-radius:50%;
    overflow:hidden;

    border:3px solid #a000ff;

    box-shadow:
        0 0 15px #9b00ff,
        0 0 40px #7800ff,
        0 0 80px rgba(130,0,255,.5);

    animation:logoGlow 2.5s ease-in-out infinite alternate;
}

.logo img{
    width:100%;
    height:100%;
    object-fit:cover;
}

@keyframes logoGlow{
    from{
        box-shadow:
            0 0 15px #9b00ff,
            0 0 35px #7800ff;
    }

    to{
        box-shadow:
            0 0 25px #c000ff,
            0 0 70px #8000ff;
    }
}

/* =========================
   TITLE
========================= */

.title{
    font-size:52px;
    font-weight:900;
    letter-spacing:-2px;

    text-shadow:
        0 0 12px rgba(255,255,255,.25);
}

.title span{
    color:#b63cff;

    text-shadow:
        0 0 10px #a000ff,
        0 0 25px #8500ff,
        0 0 45px #6500cc;
}

.subtitle{
    margin-top:4px;

    font-size:13px;
    font-weight:bold;

    letter-spacing:5px;

    color:#c45cff;

    text-shadow:
        0 0 10px #9700ff;
}

.line{
    width:85px;
    height:3px;

    margin:12px auto 25px;

    border-radius:20px;

    background:#b000ff;

    box-shadow:
        0 0 10px #b000ff,
        0 0 30px #8b00ff;
}

/* =========================
   LINKS
========================= */

.links{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.link{
    position:relative;

    height:64px;

    display:grid;
    grid-template-columns:70px 1fr 45px;

    align-items:center;

    padding:0 18px;

    text-decoration:none;

    background:rgba(0,0,0,.78);

    border:2px solid currentColor;

    border-radius:14px;

    transition:
        transform .2s ease,
        box-shadow .2s ease,
        background .2s ease;
}

.link:hover{
    transform:scale(1.025);

    background:rgba(20,0,30,.9);

    box-shadow:
        0 0 15px currentColor,
        0 0 35px currentColor;
}

.icon{
    display:flex;
    align-items:center;
    justify-content:flex-start;
}

.icon svg{
    width:32px;
    height:32px;
    fill:currentColor;
}

.name{
    font-size:20px;
    font-weight:800;
}

.arrow{
    font-size:34px;
    line-height:1;
    text-align:right;
}

/* =========================

<script>

/* ==================================
   CREATE HYPERSPACE STARS
================================== */

const space = document.getElementById("space");

const STAR_COUNT = 500;

for(let i = 0; i < STAR_COUNT; i++){

    const star = document.createElement("div");

    star.className = "star";

    /* Random direction */

    const angle =
        Math.random() * 360;

    /* Random speed */

    const duration =
        1.2 + Math.random() * 2.8;

    /* Random delay */

    const delay =
        -Math.random() * 4;

    star.style.setProperty(
        "--angle",
        angle + "deg"
    );

    star.style.setProperty(
        "--duration",
        duration + "s"
    );

    star.style.setProperty(
        "--delay",
        delay + "s"
    );

    /* Different sizes */

    const size =
        1 + Math.random() * 3;

    star.style.width =
        size + "px";

    star.style.height =
        size + "px";

    space.appendChild(star);
}

</script>
