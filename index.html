<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YardenRGS</title>

<style>
:root {
    --purple: #9b00ff;
    --purple2: #c04cff;
    --bg: #030006;
    --card: rgba(5, 2, 10, 0.82);
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
}

body {
    min-height: 100vh;
    background:
        radial-gradient(circle at 50% 10%, rgba(140, 0, 255, 0.16), transparent 30%),
        radial-gradient(circle at 10% 80%, rgba(100, 0, 255, 0.10), transparent 25%),
        var(--bg);
    color: white;
    font-family: Arial, Helvetica, sans-serif;
    overflow-x: hidden;
}

/* MOVING STARS */
#stars,
#stars2 {
    position: fixed;
    inset: -100%;
    width: 300%;
    height: 300%;
    pointer-events: none;
    z-index: 0;
    background-repeat: repeat;
}

#stars {
    opacity: 0.8;
    background-image:
        radial-gradient(circle, #ffffff 1px, transparent 1.5px),
        radial-gradient(circle, #a900ff 1px, transparent 1.5px),
        radial-gradient(circle, #6d00ff 1px, transparent 1.5px);
    background-size: 150px 150px, 210px 210px, 280px 280px;
    background-position: 0 0, 50px 80px, 120px 40px;
    animation: starsMove 35s linear infinite;
}

#stars2 {
    opacity: 0.45;
    transform: scale(1.2);
    background-image:
        radial-gradient(circle, #ffffff 0.8px, transparent 1.2px),
        radial-gradient(circle, #cc66ff 0.8px, transparent 1.2px);
    background-size: 190px 190px, 320px 320px;
    background-position: 80px 30px, 20px 140px;
    animation: starsMove2 55s linear infinite;
}

@keyframes starsMove {
    from {
        transform: translate3d(0, 0, 0);
    }
    to {
        transform: translate3d(120px, 180px, 0);
    }
}

@keyframes starsMove2 {
    from {
        transform: translate3d(0, 0, 0) scale(1.2);
    }
    to {
        transform: translate3d(-160px, 220px, 0) scale(1.2);
    }
}

/* MAIN */
.container {
    position: relative;
    z-index: 2;
    width: min(92%, 760px);
    margin: auto;
    padding: 55px 0 35px;
    text-align: center;
}

/* LOGO */
.logo-wrap {
    width: 190px;
    height: 190px;
    margin: 0 auto 20px;
    border-radius: 50%;
    padding: 5px;
    background: linear-gradient(135deg, #6d00ff, #d56cff, #7800ff);
    box-shadow:
        0 0 18px rgba(155, 0, 255, 0.8),
        0 0 45px rgba(155, 0, 255, 0.25);
}

.logo {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    overflow: hidden;
    background: #08030d;
    display: flex;
    align-items: center;
    justify-content: center;
}

.logo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

/* fallback before logo.png is uploaded */
.logo-text {
    font-size: 42px;
    font-weight: 900;
    color: white;
}

/* NAME */
h1 {
    font-size: clamp(42px, 8vw, 72px);
    font-weight: 900;
    letter-spacing: -2px;
    margin-bottom: 8px;
}

h1 span {
    color: var(--purple2);
    text-shadow: 0 0 18px rgba(192, 76, 255, 0.45);
}

.subtitle {
    color: #c879ff;
    letter-spacing: 6px;
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 16px;
}

.divider {
    width: 90px;
    height: 4px;
    margin: 0 auto 30px;
    border-radius: 10px;
    background: linear-gradient(90deg, transparent, #b000ff, transparent);
    box-shadow: 0 0 18px rgba(176, 0, 255, 0.8);
}

/* LINKS */
.links {
    display: flex;
    flex-direction: column;
    gap: 16px;
}

.link {
    position: relative;
    min-height: 86px;
    border: 2px solid var(--purple);
    border-radius: 18px;
    background:
        linear-gradient(180deg, rgba(255,255,255,0.02), rgba(0,0,0,0.35)),
        var(--card);
    text-decoration: none;
    color: white;
    display: grid;
    grid-template-columns: 72px 1fr 50px;
    align-items: center;
    padding: 0 20px;
    overflow: hidden;
    transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        background 0.2s ease;
    box-shadow:
        0 0 12px rgba(155, 0, 255, 0.25),
        inset 0 0 16px rgba(155, 0, 255, 0.05);
}

.link::before {
    content: "";
    position: absolute;
    top: 0;
    left: -120%;
    width: 60%;
    height: 100%;
    background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,0.08),
        transparent
    );
    transform: skewX(-20deg);
    transition: left 0.6s ease;
}

.link:hover::before {
    left: 160%;
}

.link:hover {
    transform: translateY(-4px);
    background: rgba(20, 5, 30, 0.92);
    box-shadow:
        0 0 20px rgba(155, 0, 255, 0.5),
        0 0 45px rgba(155, 0, 255, 0.16);
}

.icon {
    display: flex;
    align-items: center;
    justify-content: flex-start;
}

.icon svg {
    width: 38px;
    height: 38px;
    fill: currentColor;
}

.name {
    text-align: center;
    font-size: 22px;
    font-weight: 800;
}

.arrow {
    font-size: 30px;
    text-align: right;
    color: white;
}

/* PLATFORM COLORS */
.kick {
    color: #53ff00;
    border-color: #53ff00;
    box-shadow:
        0 0 14px rgba(83,255,0,0.22),
        inset 0 0 15px rgba(83,255,0,0.04);
}

.youtube {
    color: #ff2020;
    border-color: #ff2020;
    box-shadow:
        0 0 14px rgba(255,32,32,0.22),
        inset 0 0 15px rgba(255,32,32,0.04);
}

.tiktok {
    color: #ffffff;
    border-color: #00f2ea;
    box-shadow:
        0 0 14px rgba(0,242,234,0.18),
        inset 0 0 15px rgba(255,0,80,0.04);
}

.twitch {
    color: #a64cff;
    border-color: #9b00ff;
    box-shadow:
        0 0 14px rgba(155,0,255,0.28),
        inset 0 0 15px rgba(155,0,255,0.05);
}

.instagram {
    color: #ff4f9a;
    border-color: #ff4f9a;
    box-shadow:
        0 0 14px rgba(255,79,154,0.22),
        inset 0 0 15px rgba(255,79,154,0.04);
}

.paypal {
    color: #2ea7ff;
    border-color: #1685ff;
    box-shadow:
        0 0 14px rgba(22,133,255,0.22),
        inset 0 0 15px rgba(22,133,255,0.04);
}

/* FOOTER */
footer {
    margin-top: 30px;
    color: #777;
    font-size: 13px;
}

footer span {
    color: var(--purple2);
    font-weight: 700;
}

/* MOBILE */
@media (max-width: 600px) {
    .container {
        padding-top: 35px;
        width: min(92%, 560px);
    }

    .logo-wrap {
        width: 150px;
        height: 150px;
    }

    .subtitle {
        font-size: 11px;
        letter-spacing: 4px;
    }

    .link {
        min-height: 72px;
        grid-template-columns: 55px 1fr 34px;
        padding: 0 14px;
        border-radius: 15px;
    }

    .icon svg {
        width: 30px;
        height: 30px;
    }

    .name {
        font-size: 18px;
    }

    .arrow {
        font-size: 25px;
    }
}
</style>
</head>
