<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YardenRGS - Links</title>
  <!-- אייקונים של Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- פונט Google -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: #08020f;
      background-image: 
        radial-gradient(circle at center, rgba(147, 51, 234, 0.3) 0%, transparent 70%),
        radial-gradient(circle at 50% 30%, rgba(192, 38, 211, 0.15) 0%, transparent 50%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
    }

    /* --- מסך פתיחה (Intro Overlay) --- */
    #intro-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #08020f;
      background-image: radial-gradient(circle at center, rgba(168, 85, 247, 0.4) 0%, transparent 60%);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }

    .intro-logo {
      width: 220px;
      height: 220px;
      object-fit: contain;
      filter: drop-shadow(0 0 25px rgba(168, 85, 247, 0.8));
      /* סיבוב 360 מעלות פעם אחת בלבד */
      animation: spinOnce 1.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    @keyframes spinOnce {
      0% {
        transform: rotate(0deg) scale(0.7);
        opacity: 0;
      }
      50% {
        opacity: 1;
      }
      100% {
        transform: rotate(360deg) scale(1);
        opacity: 1;
      }
    }

    .intro-hidden {
      opacity: 0;
      visibility: hidden;
    }

    /* --- ראשי / Container --- */
    .container {
      width: 100%;
      max-width: 480px;
      padding: 20px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 1;
    }

    .main-logo {
      width: 130px;
      height: 130px;
      object-fit: contain;
      margin-bottom: 10px;
      filter: drop-shadow(0 0 15px rgba(168, 85, 247, 0.6));
    }

    .title {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: 1px;
      color: #fff;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
    }

    .title span {
      color: #a855f7;
      text-shadow: 0 0 15px #a855f7;
    }

    .subtitle {
      font-size: 0.75rem;
      letter-spacing: 3px;
      color: #c084fc;
      margin-bottom: 25px;
      text-transform: uppercase;
    }

    /* --- קישורים --- */
    .links-wrapper {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .link-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      background: rgba(15, 7, 30, 0.85);
      border-radius: 14px;
      text-decoration: none;
      font-weight: 600;
      font-size: 1.05rem;
      transition: all 0.3s ease;
      position: relative;
      direction: ltr; /* מציג אייקון משמאל, טקסט במרכז, חץ מימין */
    }

    .link-card i.icon {
      font-size: 1.5rem;
      width: 30px;
      text-align: center;
    }

    .link-card span {
      flex: 1;
      text-align: center;
    }

    .link-card .arrow {
      font-size: 0.9rem;
      opacity: 0.8;
    }

    .link-card:hover {
      transform: translateY(-2px) scale(1.02);
    }

    /* --- עיצוב מותאם לכל רשת (ניאון לפי התמונה) --- */
    /* Kick */
    .kick {
      border: 1.5px solid #53fc18;
      color: #53fc18;
      box-shadow: 0 0 10px rgba(83, 252, 24, 0.2);
    }
    .kick:hover { box-shadow: 0 0 20px rgba(83, 252, 24, 0.6); }

    /* Discord */
    .discord {
      border: 1.5px solid #5865F2;
      color: #5865F2;
      box-shadow: 0 0 10px rgba(88, 101, 242, 0.2);
    }
    .discord:hover { box-shadow: 0 0 20px rgba(88, 101, 242, 0.6); }

    /* Twitch */
    .twitch {
      border: 1.5px solid #a970ff;
      color: #a970ff;
      box-shadow: 0 0 10px rgba(169, 112, 255, 0.2);
    }
    .twitch:hover { box-shadow: 0 0 20px rgba(169, 112, 255, 0.6); }

    /* TikTok */
    .tiktok {
      border: 1.5px solid #ffffff;
      color: #ffffff;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
    }
    .tiktok:hover { box-shadow: 0 0 20px rgba(255, 255, 255, 0.6); }

    /* Instagram */
    .instagram {
      border: 1.5px solid #e1306c;
      color: #f86f7b;
      box-shadow: 0 0 10px rgba(225, 48, 108, 0.2);
    }
    .instagram:hover { box-shadow: 0 0 20px rgba(225, 48, 108, 0.6); }

    /* PayPal */
    .paypal {
      border: 1.5px solid #0079c1;
      color: #3b99fc;
      box-shadow: 0 0 10px rgba(0, 121, 193, 0.2);
    }
    .paypal:hover { box-shadow: 0 0 20px rgba(0, 121, 193, 0.6); }

    /* WhatsApp */
    .whatsapp {
      border: 1.5px solid #25d366;
      color: #25d366;
      box-shadow: 0 0 10px rgba(37, 211, 102, 0.2);
    }
    .whatsapp:hover { box-shadow: 0 0 20px rgba(37, 211, 102, 0.6); }

    /* --- פוטר --- */
    footer {
      margin-top: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .social-bottom {
      display: flex;
      gap: 18px;
    }

    .social-bottom a {
      color: #c084fc;
      font-size: 1.2rem;
      transition: color 0.3s ease;
    }

    .social-bottom a:hover {
      color: #fff;
    }

    .copyright {
      font-size: 0.75rem;
      color: #888;
      direction: ltr;
    }
  </style>
</head>
<body>

  <!-- מסך הפתיחה -->
  <div id="intro-overlay">
    <!-- החלף את logo.png בנתיב לקובץ הלוגו שלך -->
    <img src="logo.png" alt="YardenRGS Logo" class="intro-logo">
  </div>

  <!-- תוכן האתר הראשי -->
  <div class="container">
    <div class="header">
      <img src="logo.png" alt="YardenRGS Logo" class="main-logo">
      <h1 class="title">Yarden<span>RGS</span></h1>
      <p class="subtitle">WELCOME TO MY LINKS</p>
    </div>

    <div class="links-wrapper">
      <!-- Kick -->
      <a href="https://kick.com/YOUR_USERNAME" target="_blank" class="link-card kick">
        <i class="fa-solid fa-k icon"></i>
        <span>Kick</span>
        <i class="fa-solid fa-chevron-right arrow"></i>
      </a>

      <!-- Discord -->
      <a href="https://discord.gg/YOUR_INVITE" target="_blank" class="link-card discord">
        <i class="fa-brands fa-discord icon"></i>
        <span>Discord</span>
        <i class="fa-solid fa-chevron-right arrow"></i>
      </a>

      <!-- Twitch -->
      <a href="https://twitch.tv/YOUR_USERNAME" target="_blank" class="link-card twitch">
        <i class="fa-brands fa-twitch icon"></i>
        <span>Twitch</span>
        <i class="fa-solid fa-chevron-right arrow"></i>
      </a>

      <!-- TikTok -->
      <a href="https://tiktok.com/@YOUR_USERNAME" target="_blank" class="link-card tiktok">
        <i class="fa-brands fa-tiktok icon"></i>
        <span>TikTok</span>
        <i class="fa-solid fa-chevron-right arrow"></i>
      </a>

      <!-- Instagram -->
      <a href="https://instagram.com/YOUR_USERNAME" target="_blank" class="link-card instagram">
        <i class="fa-brands fa-instagram icon"></i>
        <span>Instagram</span>
        <i class="fa-solid fa-chevron-right arrow"></i>
      </a>

      <!-- PayPal -->
      <a href="https://paypal.me/YOUR_USERNAME" target="_blank" class="link-card paypal">
        <i class="fa-brands fa-paypal icon"></i>
        <span>PayPal</span>
        <i class="fa-solid fa-chevron-right arrow"></i>
      </a>

      <!-- WhatsApp -->
      <a href="https://wa.me/YOUR_PHONE_NUMBER" target="_blank" class="link-card whatsapp">
        <i class="fa-brands fa-whatsapp icon"></i>
        <span>WhatsApp</span>
        <i class="fa-solid fa-chevron-right arrow"></i>
      </a>
    </div>

    <footer>
      <div class="social-bottom">
        <a href="https://discord.gg/YOUR_INVITE" target="_blank"><i class="fa-brands fa-discord"></i></a>
        <a href="https://twitch.tv/YOUR_USERNAME" target="_blank"><i class="fa-brands fa-twitch"></i></a>
        <a href="https://tiktok.com/@YOUR_USERNAME" target="_blank"><i class="fa-brands fa-tiktok"></i></a>
        <a href="https://instagram.com/YOUR_USERNAME" target="_blank"><i class="fa-brands fa-instagram"></i></a>
      </div>
      <p class="copyright">© 2026 YardenRGS. All rights reserved.</p>
    </footer>
  </div>

  <script>
    // תזמון העלמת מסך הפתיחה לאחר סיום הסיבוב
    window.addEventListener('DOMContentLoaded', () => {
      const intro = document.getElementById('intro-overlay');
      
      // הלהביא את המסך להיעלם אחרי 1.6 שניות (אחרי הסיבוב ב-1.5 שניות)
      setTimeout(() => {
        intro.classList.add('intro-hidden');
      }, 1600);
    });
  </script>
</body>
</html>
