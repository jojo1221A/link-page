<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    min-height:100%;
}

body{
    background:#010003;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
    overflow-x:hidden;
}

/* =================================
   DARK SPACE BACKGROUND
================================= */

body::before{
    content:"";
    position:fixed;
    inset:0;
    z-index:-5;

    background:
        radial-gradient(
            ellipse at center,
            rgba(105,0,180,.16) 0%,
            rgba(25,0,45,.10) 30%,
            #010003 72%
        );
}

/* Purple energy */

.energy{
    position:fixed;
    inset:-20%;
    z-index:-4;
    pointer-events:none;

    background:
        radial-gradient(
            ellipse at 50% 38%,
            rgba(140,0,255,.30) 0%,
            rgba(85,0,150,.17) 17%,
            transparent 48%
        );

    filter:blur(18px);

    animation:energyPulse 6s ease-in-out infinite;
}

@keyframes energyPulse{
    0%,100%{
        opacity:.55;
        transform:scale(1);
    }

    50%{
        opacity:1;
        transform:scale(1.08);
    }
}

/* =================================
   INTRO
================================= */

#intro{
    position:fixed;
    inset:0;
    z-index:9999;

    display:flex;
    align-items:center;
    justify-content:center;

    overflow:hidden;

    background:
        radial-gradient(
            circle at center,
            rgba(110,0,210,.20),
            rgba(20,0,35,.12) 35%,
            #000 78%
        );

    transition:
        opacity .9s ease,
        visibility .9s ease;
}

#intro.hide{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
}

/* =================================
   HYPERSPACE
================================= */

#hyperspace{
    position:absolute;
    inset:0;
    overflow:hidden;
}

.star{
    position:absolute;

    left:50%;
    top:50%;

    width:2px;
    height:2px;

    border-radius:50%;

    background:white;

    box-shadow:
        0 0 5px white,
        0 0 12px #a800ff,
        0 0 22px #7b00ff;

    transform-origin:center;

    animation:
        fly var(--duration) linear infinite;

    animation-delay:var(--delay);
}

@keyframes fly{

    0%{
        transform:
            translate(-50%,-50%)
            translate(0,0)
            scale(.1);

        opacity:0;
    }

    5%{
        opacity:1;
    }

    100%{
        transform:
            translate(-50%,-50%)
            translate(var(--x),var(--y))
            scale(5);

        opacity:0;
    }
}

/* Long Star-Wars style streaks */

.streak{
    position:absolute;

    left:50%;
    top:50%;

    width:2px;
    height:120px;

    border-radius:50%;

    background:
        linear-gradient(
            to bottom,
            transparent,
            white 35%,
            #c06cff 70%,
            transparent
        );

    box-shadow:
        0 0 8px #b000ff,
        0 0 18px #8c00ff;

    transform-origin:50% 100%;

    animation:
        streakFly var(--duration) linear infinite;

    animation-delay:var(--delay);
}

@keyframes streakFly{

    0%{
        transform:
            translate(-50%,-50%)
            rotate(var(--angle))
            translateY(0)
            scaleY(.1);

        opacity:0;
    }

    8%{
        opacity:1;
    }

    100%{
        transform:
            translate(-50%,-50%)
            rotate(var(--angle))
            translateY(-850px)
            scaleY(1.8);

        opacity:0;
    }
}

/* =================================
   INTRO LOGO
================================= */

.intro-logo{
    position:relative;

    width:min(48vw,430px);
    aspect-ratio:1/1;

    z-index:10;

    transform-style:preserve-3d;

    animation:
        logoIntro .8s ease-out forwards,
        logoSpin 2.7s cubic-bezier(.18,.72,.15,1) .45s forwards;
}

.intro-logo img{
    width:100%;
    height:100%;

    object-fit:cover;

    border-radius:50%;

    display:block;

    border:4px solid #9b00ff;

    box-shadow:
        0 0 20px #9700ff,
        0 0 50px #8000ff,
        0 0 110px rgba(140,0,255,.85),
        0 0 180px rgba(90,0,180,.45);

    backface-visibility:hidden;
}

@keyframes logoIntro{
    from{
        opacity:0;
        transform:scale(.15);
    }

    to{
        opacity:1;
        transform:scale(1);
    }
}

/* בדיוק 360 מעלות */

@keyframes logoSpin{
    from{
        transform:rotateY(0deg);
    }

    to{
        transform:rotateY(360deg);
    }
}

/* =================================
   WEBSITE
================================= */

#site{

    padding:

    opacity:0;

    transform:translateY(25px);

    transition:
        opacity 1s ease,
        transform 1s ease;

#site.show{
    opacity:1;
    transform:translateY(0);
}

.container{
    width:min(100%,720px);
    margin:auto;

    text-align:center;

    position:relative;

   PURPLE ENERGY BEHIND SITE
================================= */

    top:300px;

    pointer-events:none;

================================= */

<script>

/* =================================
   CREATE HYPERSPACE STARS
================================= */

const hyperspace =
    document.getElementById("hyperspace");

/* הרבה כוכבים */

for(let i=0;i<260;i++){

    const star =
        document.createElement("div");

    star.className="star";

    const angle =
        Math.random()*Math.PI*2;

    /*
       Very large distance
       so the stars fly OUTWARD
       from the center.
    */

    const distance =
        650 + Math.random()*1100;

    const x =
        Math.cos(angle)*distance;

    const y =
        Math.sin(angle)*distance;

    star.style.setProperty(
        "--x",
        x+"px"
    );

    star.style.setProperty(
        "--y",
        y+"px"
    );

    star.style.setProperty(
        "--duration",
        (1.0+Math.random()*2.2)+"s"
    );

    star.style.setProperty(
        "--delay",
        (-Math.random()*3)+"s"
    );

    hyperspace.appendChild(star);
}


/* =================================
   LONG STREAKS
================================= */

for(let i=0;i<75;i++){

    const streak =
        document.createElement("div");

    streak.className="streak";

    streak.style.setProperty(
        "--angle",
        Math.random()*360+"deg"
    );

    streak.style.setProperty(
        "--duration",
        (1.2+Math.random()*2)+"s"
    );

    streak.style.setProperty(
        "--delay",
        (-Math.random()*3)+"s"
    );

    hyperspace.appendChild(streak);
}


/* =================================
   SHOW WEBSITE
================================= */

window.addEventListener("load",()=>{

    /*
       .45s delay
       + 2.7s rotation
       + small pause
    */

    setTimeout(()=>{

        document
            .getElementById("intro")
            .classList.add("hide");

        document
            .getElementById("site")
            .classList.add("show");

    },3400);

});

</script>
