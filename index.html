<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NyRoXx | Links</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#020006;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
    overflow-x:hidden;
}

/* =========================
   BACKGROUND
========================= */

body::before{
    content:"";
    position:fixed;
    inset:0;
    z-index:-5;
    background:
        radial-gradient(circle at 50% 30%,rgba(130,25,255,.25),transparent 35%),
        radial-gradient(circle at 20% 80%,rgba(80,0,255,.18),transparent 30%),
        #020006;
}

body::after{
    content:"";
    position:fixed;
    inset:-50%;
    z-index:-4;
    background:
        radial-gradient(circle,rgba(140,35,255,.18) 0 2px,transparent 3px);
    background-size:90px 90px;
    animation:stars 18s linear infinite;
}

/* =========================
   INTRO
========================= */

#intro{
    height:100vh;
    min-height:650px;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    overflow:hidden;
    background:
        radial-gradient(circle at center,
        rgba(120,20,255,.3),
        rgba(20,0,40,.5) 35%,
        #020006 75%);
}

.intro-content{
    text-align:center;
    position:relative;
    z-index:5;
    animation:introFloat 3s ease-in-out infinite alternate;
}

.logo-container{
    width:320px;
    height:320px;
    position:relative;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:center;
}

.logo-container::before,
.logo-container::after{
    content:"";
    position:absolute;
    border-radius:50%;
    border:2px solid rgba(157,52,255,.8);
    box-shadow:
        0 0 15px #8d28ff,
        0 0 50px rgba(130,20,255,.7);
}

.logo-container::before{
    width:280px;
    height:280px;
    animation:rotateRing 7s linear infinite;
}

.logo-container::after{
    width:230px;
    height:230px;
    border-style:dashed;
    animation:rotateRingReverse 5s linear infinite;
}

.logo{
    width:210px;
    height:210px;
    border-radius:50%;
    object-fit:cover;
    position:relative;
    z-index:3;

    /* החלף את ה-URL הזה בלוגו שלך אם תרצה */
    background:
        linear-gradient(135deg,#18002d,#050008);

    box-shadow:
        0 0 20px #8d24ff,
        0 0 60px rgba(128,20,255,.8),
        0 0 120px rgba(100,0,255,.4);

    animation:
        logo360 7s linear infinite,
        logoFloat 2.5s ease-in-out infinite alternate;
}

.logo-text{
    margin-top:25px;
    font-size:58px;
    font-weight:900;
    letter-spacing:-3px;
    text-shadow:
        0 0 10px #8d25ff,
        0 0 35px #6515bd;
}

.logo-text span{
    color:#9b35ff;
}

.subtitle{
    margin-top:8px;
    font-size:13px;
    letter-spacing:7px;
    color:#c88aff;
}

.loading{
    width:220px;
    height:4px;
    margin:30px auto;
    background:#241033;
    border-radius:10px;
    overflow:hidden;
}

.loading::after{
    content:"";
    display:block;
    width:50%;
    height:100%;
    background:#9c30ff;
    box-shadow:0 0 15px #a43aff;
    animation:loading 2s ease-in-out infinite;
}

/* =========================
   HOME
========================= */

#home{
    min-height:100vh;
    padding:70px 20px 40px;
    display:flex;
    flex-direction:column;
    align-items:center;
    position:relative;
    overflow:hidden;

    background:
        radial-gradient(circle at 50% 15%,
        rgba(130,25,255,.25),
        transparent 35%);
}

.home-decoration{
    position:absolute;
    width:700px;
    height:700px;
    border-radius:50%;
    border:1px solid rgba(145,35,255,.15);
    box-shadow:
        0 0 80px rgba(125,20,255,.12),
        inset 0 0 80px rgba(125,20,255,.08);
    animation:rotateRing 20s linear infinite;
}

.home-decoration.two{
    width:500px;
    height:500px;
    animation:rotateRingReverse 15s linear infinite;
}

.profile{
    text-align:center;
    position:relative;
    z-index:3;
}

.profile-logo{
    width:145px;
    height:145px;
    border-radius:50%;
    object-fit:cover;
    background:#08000d;

    box-shadow:
        0 0 20px #8d25ff,
        0 0 60px rgba(130,20,255,.7);

    animation:logo360 12s linear infinite;
}

.profile h1{
    margin-top:18px;
    font-size:45px;
    font-weight:900;
    text-shadow:0 0 25px #7620d8;
}

.profile h1 span{
    color:#9c35ff;
}

.profile p{
    margin-top:7px;
    font-size:11px;
    letter-spacing:5px;
    color:#c78aff;
}

/* =========================
   LINKS
========================= */

.links{
    width:min(600px,94vw);
    margin-top:35px;
    display:flex;
    flex-direction:column;
    gap:14px;
    position:relative;
    z-index:5;
}

.link{
    height:70px;
    border:2px solid;
    border-radius:12px;

    display:grid;
    grid-template-columns:55px 1fr 35px;
    align-items:center;

    padding:0 18px;

    color:white;
    text-decoration:none;

    background:rgba(4,0,10,.78);
    backdrop-filter:blur(8px);

    font-size:20px;
    font-weight:800;

    position:relative;
    overflow:hidden;

    transition:
        transform .25s ease,
        box-shadow .25s ease,
        background .25s ease;
}

.link::before{
    content:"";
    position:absolute;
    top:0;
    left:-120%;
    width:100%;
    height:100%;
    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.15),
            transparent
        );
    transition:.5s;
}

.link:hover::before{
    left:120%;
}

.link:hover{
    transform:translateY(-4px) scale(1.02);
}

.icon{
    font-size:27px;
    text-align:center;
}

.arrow{
    text-align:right;
    font-size:35px;
    font-weight:300;
}

.kick{
    border-color:#62ff00;
    box-shadow:0 0 12px rgba(98,255,0,.5);
}

.kick:hover{
    box-shadow:
        0 0 20px #62ff00,
        0 0 50px rgba(98,255,0,.35);
}

.youtube{
    border-color:#ff2020;
    box-shadow:0 0 12px rgba(255,32,32,.45);
}

.youtube:hover{
    box-shadow:
        0 0 20px #ff2020,
        0 0 50px rgba(255,32,32,.35);
}

.tiktok{
    border-color:#fff;
    box-shadow:0 0 12px rgba(255,255,255,.35);
}

.tiktok:hover{
    box-shadow:
        0 0 20px white,
        0 0 50px rgba(255,255,255,.25);
}

.twitch{
    border-color:#9835ff;
    box-shadow:0 0 12px rgba(152,53,255,.5);
}

.twitch:hover{
    box-shadow:
        0 0 20px #9835ff,
        0 0 50px rgba(152,53,255,.4);
}

.instagram{
    border-color:#ff55aa;
    box-shadow:0 0 12px rgba(255,85,170,.4);
}

.instagram:hover{
    box-shadow:
        0 0 20px #ff55aa,
        0 0 50px rgba(255,85,170,.35);
}

.donation{
    border-color:#3195ff;
    box-shadow:0 0 12px rgba(49,149,255,.45);
}

.donation:hover{
    box-shadow:
        0 0 20px #3195ff,
        0 0 50px rgba(49,149,255,.35);
}

/* =========================
   FOOTER
========================= */

footer{
    margin-top:35px;
    font-size:12px;
    color:#aaa;
    position:relative;
    z-index:4;
}

footer span{
    color:#9b35ff;
}

/* =========================
   ANIMATIONS
========================= */

@keyframes logo360{
    from{
        transform:rotateY(0deg);
    }
    to{
        transform:rotateY(360deg);
    }
}

@keyframes rotateRing{
    from{
        transform:rotate(0deg);
    }
    to{
        transform:rotate(360deg);
    }
}

@keyframes rotateRingReverse{
    from{
        transform:rotate(360deg);
    }
    to{
        transform:rotate(0deg);
    }
}

@keyframes stars{
    from{
        transform:translate(0,0);
    }
    to{
        transform:translate(180px,130px);
    }
}

@keyframes introFloat{
    from{
        transform:translateY(-7px);
    }
    to{
        transform:translateY(7px);
    }
}

@keyframes logoFloat{
    from{
        margin-top:-5px;
    }
    to{
        margin-top:5px;
    }
}

@keyframes loading{
    0%{
        transform:translateX(-150%);
    }
    50%{
        transform:translateX(120%);
    }
    100%{
        transform:translateX(250%);
    }
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .logo-container{
        width:270px;
        height:270px;
    }

    .logo-container::before{
        width:240px;
        height:240px;
    }

    .logo-container::after{
        width:200px;
        height:200px;
    }

    .logo{
        width:180px;
        height:180px;
    }

    .logo-text{
        font-size:43px;
    }

    .profile-logo{
        width:125px;
        height:125px;
    }

    .profile h1{
        font-size:36px;
    }

    .link{
        height:62px;
        font-size:17px;
        grid-template-columns:48px 1fr 30px;
    }
}
</style>
</head>

<script>

/* =========================
   INTRO -> HOME
========================= */

setTimeout(function(){

    document.getElementById("home").scrollIntoView({
        behavior:"smooth"
    });

},4000);


/* =========================
   MOUSE PARALLAX
========================= */

document.addEventListener("mousemove",function(e){

    const x =
        (e.clientX / window.innerWidth - .5) * 12;

    const y =
        (e.clientY / window.innerHeight - .5) * 12;

    const intro =
        document.querySelector(".intro-content");

    intro.style.transform =
        "translate(" + x + "px," + y + "px)";

});

</script>
