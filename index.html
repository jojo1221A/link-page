<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YardenRGS</title>

<style>
:root {
    --purple: #a100ff;
    --purple-light: #d05cff;
    --bg: #020004;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    color: white;
    background:
        radial-gradient(circle at 50% 15%, rgba(145, 0, 255, 0.20), transparent 32%),
        radial-gradient(circle at 15% 80%, rgba(80, 0, 180, 0.16), transparent 28%),
        #020004;
    overflow-x: hidden;
}

/* MOVING STARS */
.stars,
.stars2 {
    position: fixed;
    inset: -100%;
    width: 300%;
    height: 300%;
    pointer-events: none;
    z-index: 0;
}

.stars {
    background-image:
        radial-gradient(circle, #ffffff 1px, transparent 1.5px),
        radial-gradient(circle, #b84cff 1px, transparent 1.5px),
        radial-gradient(circle, #7a00ff 1px, transparent 1.5px);
    background-size:
        145px 145px,
        210px 210px,
        280px 280px;
    background-position:
        0 0,
        50px 80px,
        120px 40px;
    animation: moveStars 32s linear infinite;
    opacity: 0.9;
}

.stars2 {
    background-image:
        radial-gradient(circle, #ffffff 0.8px, transparent 1.2px),
        radial-gradient(circle, #cf75ff 0.8px, transparent 1.2px);
    background-size:
        190px 190px,
        320px 320px;
    background-position:
        80px 30px,
        20px 140px;
    animation: moveStars2 50s linear infinite;
    opacity: 0.45;
}

@keyframes moveStars {
    from {
        transform: translate(0, 0);
    }
    to {
        transform: translate(130px, 190px);
    }
}

@keyframes moveStars2 {
    from {
        transform: translate(0, 0);
    }
    to {
        transform: translate(-170px, 220px);
    }
}

/* MAIN */
.container {
    position: relative;
    z-index: 2;
    width: min(92%, 760px);
    margin: auto;
    padding: 50px 0 35px;
    text-align: center;
}

/* LOGO */
.logo-wrap {
    width: 195px;
    height: 195px;
    margin: 0 auto 20px;
    border-radius: 50%;
    padding: 4px;
    background: linear-gradient(
        135deg,
        #6900ff,
        #d65cff,
        #8500ff
    );
    box-shadow:
        0 0 18px rgba(170, 0, 255, 0.8),
        0 0 45px rgba(170, 0, 255, 0.35);
}

.logo {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    overflow: hidden;
    background: #050007;
}

.logo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

/* TITLE */
h1 {
    font-size: clamp(42px, 8vw, 72px);
    font-weight: 900;
    letter-spacing: -2px;
    margin-bottom: 8px;
}

h1 span {
    color: var(--purple-light);
    text-shadow: 0 0 20px rgba(208, 92, 255, 0.45);
}

.subtitle {
    color: #d06cff;
    font-size: 14px;
    font-weight: 800;
    letter-spacing: 6px;
    margin-bottom: 17px;
}

.divider {
    width: 100px;
    height: 4px;
    margin: 0 auto 30px;
    border-radius: 20px;
    background: #b000ff;
    box-shadow:
        0 0 10px #a100ff,
        0 0 25px rgba(161, 0, 255, 0.75);
}

/* LINKS */
.links {
    display: flex;
    flex-direction: column;
    gap: 16px;
}

.link {
    min-height: 86px;
    display: grid;
    grid-template-columns: 70px 1fr 40px;
    align-items: center;
    padding: 0 20px;
    text-decoration: none;
    border-radius: 18px;
    background: rgba(3, 0, 7, 0.88);
    border: 2px solid var(--purple);
    transition: 0.2s ease;
    box-shadow:
        0 0 12px rgba(170, 0, 255, 0.22),
        inset 0 0 16px rgba(170, 0, 255, 0.04);
}

.link:hover {
    transform: translateY(-4px) scale(1.01);
}

.icon {
    display: flex;
    justify-content: flex-start;
    align-items: center;
}

.icon svg {
    width: 38px;
    height: 38px;
    fill: currentColor;
}

.name {
    text-align: center;
    font-size: 22px;
    font-weight: 800;
}

.arrow {
    text-align: right;
    font-size: 32px;
    color: currentColor;
}

/* COLORS */

.kick {
    color: #53ff00;
}

.youtube {
    color: #ff2020;
}

.discord {
    color: #8b5cff;
}

.tiktok {
    color: #ffffff;
}

.twitch {
    color: #a64cff;
}

.instagram {
    color: #ff5b9d;
}

.paypal {
    color: #2697ff;
}

.kick:hover {
    box-shadow: 0 0 26px rgba(83,255,0,0.38);
}

.youtube:hover {
    box-shadow: 0 0 26px rgba(255,32,32,0.38);
}

.discord:hover {
    box-shadow: 0 0 26px rgba(139,92,255,0.38);
}

.tiktok:hover {
    box-shadow: 0 0 26px rgba(0,242,234,0.28);
}

.twitch:hover {
    box-shadow: 0 0 26px rgba(166,76,255,0.38);
}

.instagram:hover {
    box-shadow: 0 0 26px rgba(255,91,157,0.38);
}

.paypal:hover {
    box-shadow: 0 0 26px rgba(38,151,255,0.38);
}

/* FOOTER */
footer {
    margin-top: 32px;
    color: #777;
    font-size: 13px;
}

footer span {
    color: var(--purple-light);
    font-weight: 800;
}

/* MOBILE */
@media (max-width: 600px) {

    .container {
        width: 92%;
        padding-top: 35px;
    }

    .logo-wrap {
        width: 150px;
        height: 150px;
    }

    .subtitle {
        font-size: 11px;
        letter-spacing: 4px;
    }

    .link {
        min-height: 74px;
        grid-template-columns: 55px 1fr 30px;
        padding: 0 15px;
        border-radius: 15px;
    }

    .icon svg {
        width: 31px;
        height: 31px;
    }

    .name {
        font-size: 18px;
    }

    .arrow {
        font-size: 26px;
    }
}
</style>
</head>
