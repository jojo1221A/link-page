<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    min-height:100%;
}

body{
    background:#020006;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
    overflow-x:hidden;
}

/* =========================
   BACKGROUND
========================= */

#space{
    position:fixed;
    inset:0;
    z-index:0;
    overflow:hidden;
    pointer-events:none;

    background:
        radial-gradient(
            circle at center,
            rgba(120,0,255,.20),
            transparent 38%
        ),
        #020006;
}

.star{
    position:absolute;
    left:50%;
    top:50%;

    width:2px;
    height:2px;

    border-radius:50%;
    background:white;

    box-shadow:
        0 0 5px white,
        0 0 10px #a900ff;

    animation:
        flyStar var(--speed) linear infinite;

    animation-delay:var(--delay);
}

@keyframes flyStar{

    0%{
        transform:
            translate(-50%,-50%)
            translate(0,0)
            scale(.1);

        opacity:0;
    }

    8%{
        opacity:1;
    }

    100%{
        transform:
            translate(-50%,-50%)
            translate(var(--x),var(--y))
            scale(4);

        opacity:0;
    }
}

/* =========================
   INTRO
========================= */

#intro{
    position:fixed;
    inset:0;

    z-index:9999;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        radial-gradient(
            circle at center,
            rgba(140,0,255,.22),
            transparent 35%
        ),
        #010002;

    transition:
        opacity .8s ease,
        visibility .8s ease;
}

#intro.hide{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
}

/* =========================
   LOGO COIN
========================= */

.coin{
    position:relative;
    z-index:10;

    width:300px;
    height:300px;

    transform-style:preserve-3d;

    animation:
        coinAppear .8s ease-out forwards,
        coinRotate 2.7s cubic-bezier(.18,.72,.18,1) .45s forwards;
}

.coin img{
    width:100%;
    height:100%;

    display:block;

    object-fit:cover;

    border-radius:50%;

    border:4px solid #a900ff;

    box-shadow:
        0 0 20px #a900ff,
        0 0 55px rgba(160,0,255,.8),
        0 0 120px rgba(100,0,255,.35);

    backface-visibility:hidden;
}

@keyframes coinAppear{
    0%{
        opacity:0;
        transform:scale(.05);
    }

    100%{
        opacity:1;
        transform:scale(1);
    }
}

/* בדיוק סיבוב אחד */

@keyframes coinRotate{
    0%{
        transform:rotateY(0deg);
    }

    100%{
        transform:rotateY(360deg);
    }
}

/* =========================
   WEBSITE
========================= */

#site{
    position:relative;
    z-index:2;

    min-height:100vh;

    padding:45px 20px 35px;

    opacity:0;

    transform:translateY(20px);

    transition:
        opacity .9s ease,
        transform .9s ease;
}

#site.show{
    opacity:1;
    transform:translateY(0);
}

.container{
    width:min(100%,760px);
    margin:auto;
    text-align:center;
}

   LOGO
========================= */

.logo{

    height:100%;

    overflow:hidden;

}

.logo img{

}

/* =========================

========================= */

.divider{

    box-shadow:

/* =========================
   LINKS
========================= */

.links{

    flex-direction:column;
    gap:16px;

.link{

    transition:
        transform .2s ease,
        box-shadow .2s ease;

.link:hover{

}

.icon{

    align-items:center;
    justify-content:flex-start;

.icon svg{

.name{

.arrow{

<script>

/* =========================
   CREATE HYPERSPACE STARS
========================= */

const space = document.getElementById("space");

for(let i = 0; i < 220; i++){

    const star = document.createElement("div");

    star.className = "star";

    /*
       Random direction from center
       so stars fly OUTWARD in every direction.
    */

    const angle = Math.random() * Math.PI * 2;

    const distance =
        500 + Math.random() * 1000;

    const x =
        Math.cos(angle) * distance;

    const y =
        Math.sin(angle) * distance;

    star.style.setProperty(
        "--x",
        x + "px"
    );

    star.style.setProperty(
        "--y",
        y + "px"
    );

    star.style.setProperty(
        "--speed",
        (1.1 + Math.random() * 2.2) + "s"
    );

    star.style.setProperty(
        "--delay",
        (-Math.random() * 3) + "s"
    );

    space.appendChild(star);
}


/* =========================
   SHOW WEBSITE
========================= */

window.addEventListener("load", () => {

    /*
       Coin:
       0.45s delay + 2.7s rotation
       = 3.15 seconds.
    */

    setTimeout(() => {

        document
            .getElementById("intro")
            .classList.add("hide");

        document
            .getElementById("site")
            .classList.add("show");

    }, 3350);

});

</script>
