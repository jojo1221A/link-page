<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    min-height:100%;
}

body{
    background:#020006;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
    overflow-x:hidden;
}

/* =========================
   SPACE BACKGROUND
========================= */

.space{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:0;
    background:
        radial-gradient(circle at 50% 45%,
        rgba(120,0,255,.18),
        transparent 35%),
        #020006;
}

/* =========================
   NORMAL MOVING STARS
========================= */

.star{
    position:absolute;
    width:2px;
    height:2px;
    background:white;
    border-radius:50%;
    box-shadow:0 0 7px #c56cff;
    animation:starFloat linear infinite;
}

@keyframes starFloat{
    from{
        transform:translate3d(0,0,0);
        opacity:.15;
    }

    50%{
        opacity:1;
    }

    to{
        transform:translate3d(
            var(--x),
            var(--y),
            0
        );
        opacity:.1;
    }
}

/* =========================
   INTRO
========================= */

#intro{
    position:fixed;
    inset:0;
    z-index:9999;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        radial-gradient(
            circle at center,
            rgba(130,0,255,.2),
            transparent 35%
        ),
        #010002;

    transition:
        opacity .8s ease,
        visibility .8s ease;
}

#intro.hide{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
}

/* =========================
   HYPERSPACE STARS
========================= */

.hyperstars{
    position:absolute;
    inset:0;
    overflow:hidden;
    perspective:500px;
}

.hyperstar{
    position:absolute;

    width:2px;
    height:2px;

    border-radius:50%;

    background:white;

    box-shadow:
        0 0 5px white,
        0 0 10px #a900ff;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%)
        rotate(var(--angle))
        translateY(0);

    animation:
        hyperspace var(--speed) linear infinite;
}

@keyframes hyperspace{

    0%{
        transform:
            translate(-50%,-50%)
            rotate(var(--angle))
            translateY(0)
            scale(.2);

        opacity:0;
    }

    10%{
        opacity:1;
    }

    100%{
        transform:
            translate(-50%,-50%)
            rotate(var(--angle))
            translateY(-650px)
            scale(5);

        opacity:0;
    }
}

/* extra streaks */

.streak{
    position:absolute;

    width:2px;
    height:90px;

    background:
        linear-gradient(
            to bottom,
            transparent,
            white,
            #b400ff,
            transparent
        );

    opacity:.8;

    left:50%;
    top:50%;

    transform-origin:50% 100%;

    animation:
        streakMove var(--speed) linear infinite;
}

@keyframes streakMove{

    from{
        transform:
            rotate(var(--angle))
            translateY(0)
            scaleY(.2);

        opacity:0;
    }

    15%{
        opacity:1;
    }

    to{
        transform:
            rotate(var(--angle))
            translateY(-750px)
            scaleY(1.5);

        opacity:0;
    }
}

/* =========================
   COIN
========================= */

.coin{
    width:290px;
    height:290px;

    position:relative;

    z-index:5;

    transform-style:preserve-3d;

    animation:
        coinAppear .8s ease-out forwards,
        coinSpin 2.8s cubic-bezier(.15,.7,.2,1) .6s forwards;
}

.coin img{
    width:100%;
    height:100%;

    object-fit:cover;

    border-radius:50%;

    display:block;

    border:4px solid #a900ff;

    box-shadow:
        0 0 15px #a900ff,
        0 0 40px rgba(160,0,255,.8),
        0 0 100px rgba(120,0,255,.4);

    backface-visibility:hidden;
}

@keyframes coinAppear{

    from{
        opacity:0;
        transform:scale(.1);
    }

    to{
        opacity:1;
        transform:scale(1);
    }
}

/* EXACTLY ONE ROTATION */

@keyframes coinSpin{

    from{
        transform:
            rotateY(0deg)
            scale(1);
    }

    to{
        transform:
            rotateY(360deg)
            scale(1);
    }
}

   MAIN PAGE
========================= */

========================= */

.icon{

.icon svg{

.name{

.arrow{

========================= */
