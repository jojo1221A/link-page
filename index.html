<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YOURNAME — Links</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#04060c;
    --panel:#0d1526;
    --panel-2:#152036;
    --line: rgba(120,180,255,0.22);
    --ink:#eef3fb;
    --ink-dim:#93a3c4;
    --accent:#2f9bff;
    --accent-2:#7fd0ff;

    --kick:#53fc18;
    --discord:#5865f2;
    --youtube:#ff3b3b;
    --tiktok:#ff2e63;
    --instagram:#e1306c;
    --paypal:#3aa4ff;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }

  body{
    background: var(--bg);
    color: var(--ink);
    font-family:'Manrope', -apple-system, sans-serif;
    min-height:100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:64px 20px 80px;
    position:relative;
    overflow-x:hidden;
  }

  /* ---------- layered background ---------- */
  .bg{
    position:fixed;
    inset:0;
    z-index:0;
    background: linear-gradient(180deg, #070c18 0%, #050912 55%, #04060c 100%);
  }

  .blob{
    position:fixed;
    z-index:0;
    border-radius:50%;
    filter: blur(70px);
    opacity:0.55;
    pointer-events:none;
  }
  .blob--a{ width:520px; height:520px; top:-160px; left:-120px; background:#1c63d6; animation: driftA 22s ease-in-out infinite; }
  .blob--b{ width:480px; height:480px; bottom:-180px; right:-140px; background:#2f9bff; animation: driftB 26s ease-in-out infinite; }
  .blob--c{ width:360px; height:360px; top:38%; left:50%; background:#7fd0ff; opacity:0.18; animation: driftC 30s ease-in-out infinite; }

  @keyframes driftA{ 0%,100%{ transform: translate(0,0); } 50%{ transform: translate(60px,40px); } }
  @keyframes driftB{ 0%,100%{ transform: translate(0,0); } 50%{ transform: translate(-50px,-30px); } }
  @keyframes driftC{ 0%,100%{ transform: translate(-50%,0) scale(1); } 50%{ transform: translate(-50%,-30px) scale(1.15); } }

  .grid{
    position:fixed;
    inset:0;
    z-index:0;
    opacity:0.25;
    background-image:
      linear-gradient(rgba(120,180,255,0.08) 1px, transparent 1px),
      linear-gradient(90deg, rgba(120,180,255,0.08) 1px, transparent 1px);
    background-size: 42px 42px;
    -webkit-mask-image: radial-gradient(650px 500px at 50% 20%, #000 40%, transparent 85%);
    mask-image: radial-gradient(650px 500px at 50% 20%, #000 40%, transparent 85%);
  }

  #particles{ position:fixed; inset:0; z-index:1; pointer-events:none; overflow:hidden; }
  .spark{
    position:absolute;
    bottom:-10px;
    border-radius:50%;
    background: var(--accent-2);
    box-shadow: 0 0 8px var(--accent-2);
    animation-name: rise;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
  }
  @keyframes rise{
    0%{ transform: translateY(0) translateX(0); opacity:0; }
    10%{ opacity:0.8; }
    90%{ opacity:0.5; }
    100%{ transform: translateY(-108vh) translateX(20px); opacity:0; }
  }

  /* floating cutouts of you + the cats, drifting slowly up and down */
  .figure{
    position:fixed;
    z-index:1;
    pointer-events:none;
    filter: drop-shadow(0 14px 34px rgba(0,0,0,0.6)) drop-shadow(0 0 30px rgba(58,164,255,0.25));
  }
  .figure img{ display:block; width:100%; height:auto; }

  .figure--boy{
    top:-34px;
    left:50%;
    width:280px;
    margin-left:-140px;
    opacity:0.96;
    animation: floatBoy 6.5s ease-in-out infinite;
  }

  @keyframes floatBoy{ 0%,100%{ transform: translateY(0); } 50%{ transform: translateY(-18px); } }

  @media (max-width: 820px){
    .figure--boy{ width:210px; margin-left:-105px; top:-20px; opacity:0.8; }
  }
  @media (max-width: 520px){
    .figure--boy{ width:170px; margin-left:-85px; opacity:0.65; }
  }
  @media (prefers-reduced-motion: reduce){
    .figure--boy, .blob, .spark{ animation:none; }
  }

  /* the light that follows the cursor */
  .spot{
    position:fixed;
    inset:0;
    z-index:1;
    pointer-events:none;
    background: radial-gradient(480px 480px at var(--mx,50%) var(--my,25%),
                rgba(58,164,255,0.24), rgba(58,164,255,0.06) 40%, transparent 65%);
    mix-blend-mode: screen;
  }

  .card{
    position:relative;
    z-index:2;
    width:100%;
    max-width:460px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
  }

  .avatar-ring{
    position:relative;
    width:154px;
    height:154px;
    margin-bottom:16px;
  }
  .avatar-ring svg{ position:absolute; inset:0; width:100%; height:100%; }
  .ring-outer{ animation: spin 30s linear infinite; }
  .ring-inner{ animation: spin 22s linear infinite reverse; }
  @keyframes spin{ to{ transform: rotate(360deg); } }
  .avatar{
    position:absolute;
    inset:16px;
    width:calc(100% - 32px);
    height:calc(100% - 32px);
    border-radius:50%;
    object-fit:cover;
    border:3px solid var(--bg);
    box-shadow: 0 0 30px rgba(58,164,255,0.6);
  }
  .status{
    position:absolute;
    bottom:6px;
    right:6px;
    width:22px;
    height:22px;
    border-radius:50%;
    background:#22e07a;
    border:3px solid var(--bg);
    box-shadow: 0 0 10px #22e07a;
  }

  .name{
    font-family:'Archivo Black', sans-serif;
    font-size:2.15rem;
    margin:4px 0 8px;
    letter-spacing:0.5px;
    text-shadow: 0 0 26px rgba(58,164,255,0.5);
  }

  .tagline{
    margin:0 0 24px;
    color: var(--ink-dim);
    font-size:0.92rem;
  }

  .tabs{
    display:flex;
    background: rgba(13,21,38,0.75);
    backdrop-filter: blur(6px);
    border:1px solid var(--line);
    border-radius:999px;
    padding:5px;
    gap:4px;
    margin-bottom:28px;
  }
  .tab{
    border:none;
    background:transparent;
    color: var(--ink-dim);
    font-family:'Manrope', sans-serif;
    font-weight:700;
    font-size:0.78rem;
    letter-spacing:0.4px;
    padding:10px 18px;
    border-radius:999px;
    cursor:pointer;
    transition: color 0.2s ease, background 0.2s ease;
  }
  .tab.active{
    background: linear-gradient(180deg, #1e2a44, #141d33);
    color: var(--ink);
    box-shadow: inset 0 0 0 1px var(--line);
  }
  .tab:not(.active):hover{ color: var(--ink); }

  .links{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  .link{
    --brand: var(--accent);
    position:relative;
    display:flex;
    align-items:center;
    justify-content:space-between;
    width:100%;
    padding:16px 18px;
    border-radius:14px;
    background: linear-gradient(180deg, rgba(21,32,54,0.92), rgba(13,21,38,0.92));
    backdrop-filter: blur(4px);
    border:1px solid var(--line);
    text-decoration:none;
    color:var(--ink);
    overflow:hidden;
    transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
  }
  .link::before{
    content:"";
    position:absolute;
    top:0; left:-60%;
    width:40%; height:100%;
    background: linear-gradient(115deg, transparent, rgba(255,255,255,0.10), transparent);
    transform: skewX(-20deg);
    transition: left 0.6s ease;
  }
  .link:hover::before{ left:120%; }
  .link:hover{
    transform: translateY(-2px);
    border-color: var(--brand);
    box-shadow: 0 10px 28px -14px var(--brand), 0 0 0 1px var(--brand) inset;
  }
  .link:focus-visible{ outline:2px solid var(--brand); outline-offset:2px; }

  .link-text{ display:flex; flex-direction:column; align-items:flex-start; gap:2px; }
  .label{ font-weight:800; font-size:1.02rem; color: var(--brand); }
  .sub{ font-size:0.78rem; color: var(--ink-dim); display:flex; align-items:center; gap:6px; }
  .dot{ width:7px; height:7px; border-radius:50%; background: var(--brand); box-shadow: 0 0 8px var(--brand); }

  .icon{
    width:38px;
    height:38px;
    border-radius:10px;
    background: rgba(255,255,255,0.05);
    border:1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:center;
    color: var(--brand);
    flex-shrink:0;
  }
  .icon svg{ width:20px; height:20px; }

  .link--kick{ --brand: var(--kick); }
  .link--discord{ --brand: var(--discord); }
  .link--youtube{ --brand: var(--youtube); }
  .link--tiktok{ --brand: var(--tiktok); }
  .link--instagram{ --brand: var(--instagram); }
  .link--paypal{ --brand: var(--paypal); }

  .footer{
    margin-top:34px;
    font-size:0.78rem;
    color: var(--ink-dim);
    opacity:0.8;
  }

  @media (max-width:460px){
    .name{ font-size:1.6rem; }
    .tabs{ transform: scale(0.92); }
  }
  @media (prefers-reduced-motion: reduce){
    .link{ transition:none; }
    .ring-outer, .ring-inner{ animation:none; }
  }
</style>
</head>

  document.getElementById('year').textContent = new Date().getFullYear();

  const spot = document.getElementById('spot');
  window.addEventListener('pointermove', (e) => {
    const xPct = (e.clientX / window.innerWidth) * 100;
    const yPct = (e.clientY / window.innerHeight) * 100;
    spot.style.setProperty('--mx', xPct + '%');
    spot.style.setProperty('--my', yPct + '%');
  });

  // rising sparks in the background
  const field = document.getElementById('particles');
  const COUNT = 26;
  for (let i = 0; i < COUNT; i++) {
    const s = document.createElement('div');
    s.className = 'spark';
    const size = 2 + Math.random() * 3;
    s.style.width = size + 'px';
    s.style.height = size + 'px';
    s.style.left = Math.random() * 100 + '%';
    const duration = 9 + Math.random() * 10;
    s.style.animationDuration = duration + 's';
    s.style.animationDelay = (-Math.random() * duration) + 's';
    field.appendChild(s);
  }
</script>
