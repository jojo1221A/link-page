<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    min-height:100%;
}

body{
    background:#000;
    color:white;
    font-family:Arial,sans-serif;
    overflow-x:hidden;
}

/* ===== STAR BACKGROUND ===== */

#stars{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:0;
}

.star{
    position:absolute;
    width:2px;
    height:2px;
    background:#fff;
    border-radius:50%;
    box-shadow:
        0 0 5px #fff,
        0 0 10px #9d00ff;
    animation:moveStar var(--speed) linear infinite;
    animation-delay:var(--delay);
}

@keyframes moveStar{
    0%{
        transform:translate(0,0) scale(.5);
        opacity:0;
    }

    10%{
        opacity:1;
    }

    100%{
        transform:
            translate(var(--x),var(--y))
            scale(2.8);
        opacity:0;
    }
}

/* ===== PURPLE ENERGY ===== */

.energy{
    position:fixed;
    width:900px;
    height:900px;
    left:50%;
    top:300px;
    transform:translate(-50%,-50%);
    background:
        radial-gradient(
            circle,
            rgba(150,0,255,.30),
            rgba(90,0,150,.15) 35%,
            transparent 70%
        );
    filter:blur(35px);
    pointer-events:none;
    z-index:1;
}

/* ===== SITE ===== */

#site{
    position:relative;
    z-index:2;
    width:100%;
    max-width:620px;
    margin:auto;
    padding:25px 18px 30px;
    text-align:center;
}

/* ===== LOGO ===== */

.logo{
    width:125px;
    height:125px;
    margin:0 auto 8px;
    border-radius:50%;
    overflow:hidden;
    border:3px solid #8e00ff;
    box-shadow:
        0 0 15px #8e00ff,
        0 0 35px #7200ff;
}

.logo img{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* ===== TITLE ===== */

h1{
    font-size:42px;
    font-weight:900;
    letter-spacing:-2px;
    margin-bottom:3px;
}

h1 span{
    color:#a83cff;
    text-shadow:
        0 0 10px #a83cff,
        0 0 25px #7200ff;
}

.subtitle{
    font-size:11px;
    font-weight:bold;
    letter-spacing:4px;
    color:#c64cff;
    margin-bottom:8px;
}

.line{
    width:65px;
    height:3px;
    margin:0 auto 18px;
    background:#a000ff;
    border-radius:10px;
    box-shadow:
        0 0 8px #a000ff,
        0 0 20px #8500ff;
}

/* ===== LINKS ===== */

.links{
    display:flex;
    flex-direction:column;
    gap:7px;
}

.link{
    height:56px;
    display:grid;
    grid-template-columns:55px 1fr 35px;
    align-items:center;
    padding:0 13px;
    text-decoration:none;
    background:rgba(0,0,0,.72);
    border:2px solid currentColor;
    border-radius:12px;
    transition:.2s;
}

.link:hover{
    transform:scale(1.02);
    filter:brightness(1.3);
}

.icon{
    display:flex;
    justify-content:flex-start;
    align-items:center;
}

.icon svg{
    width:30px;
    height:30px;
    fill:currentColor;
}

.name{
    font-size:17px;
    font-weight:800;
    text-align:center;
}

.arrow{
    font-size:30px;
    text-align:right;
}

/* ===== COLORS ===== */

.kick{
    color:#57ff00;
    box-shadow:0 0 12px rgba(87,255,0,.22);
}

.youtube{
    color:#ff2424;
    box-shadow:0 0 12px rgba(255,36,36,.20);
}

.discord{
    color:#8b63ff;
    box-shadow:0 0 12px rgba(139,99,255,.20);
}

.tiktok{
    color:#fff;
    box-shadow:0 0 12px rgba(255,255,255,.15);
}

.twitch{

    box-shadow:0 0 12px rgba(168,70,255,.22);

.instagram{

    box-shadow:0 0 12px rgba(255,76,157,.20);

.paypal{

    box-shadow:0 0 12px rgba(22,140,255,.20);
}

/* TikTok colors */

.tiktok .icon svg{
    filter:
        drop-shadow(3px 0 0 #00f2ea)
        drop-shadow(-3px 0 0 #ff0050);
}

/* ===== FOOTER ===== */

footer{
    margin-top:18px;
    font-size:11px;
    color:#777;
}

footer span{
    color:#b43cff;
}

/* ===== MOBILE ===== */

@media(max-width:600px){

    }

    }

    }

    .link{

    }

    .name{

    }
}
</style>

<script>

/* ===== CREATE STARS ===== */

const stars = document.getElementById("stars");

for(let i = 0; i < 280; i++){

    const star = document.createElement("div");

    star.className = "star";

    const angle = Math.random() * Math.PI * 2;

    const distance =
        450 + Math.random() * 1100;

    const x =
        Math.cos(angle) * distance;

    const y =
        Math.sin(angle) * distance;

    star.style.left = "50%";
    star.style.top = "50%";

    star.style.setProperty(
        "--x",
        x + "px"
    );

    star.style.setProperty(
        "--y",
        y + "px"
    );

    star.style.setProperty(
        "--speed",
        (2 + Math.random() * 4) + "s"
    );

    star.style.setProperty(
        "--delay",
        (-Math.random() * 5) + "s"
    );

    stars.appendChild(star);
}

</script>
