<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NyRoXx | Links</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    min-height:100%;
    background:#000;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    overflow-x:hidden;
}

.site{
    position:relative;
    min-height:100vh;
    width:100%;
    overflow:hidden;
    background:#000;
}

/* BACKGROUND */

.art{
    position:absolute;
    inset:-3%;
    width:106%;
    height:106%;
    object-fit:cover;
    object-position:center;

    animation:spaceMove 14s ease-in-out infinite alternate;

    filter:
        saturate(1.12)
        brightness(.92);
}

/* DARK OVERLAY */

.glow{
    position:absolute;
    inset:0;
    pointer-events:none;
    z-index:2;

    background:
        radial-gradient(
            circle at 50% 42%,
            transparent 20%,
            rgba(0,0,0,.08) 45%,
            rgba(0,0,0,.55) 100%
        );
}

/* MOVING STARS */

.starfield{
    position:absolute;
    inset:-50%;
    z-index:3;
    pointer-events:none;
    opacity:.55;

    background-image:
        radial-gradient(
            circle,
            #fff 1px,
            transparent 1.7px
        ),
        radial-gradient(
            circle,
            #ad5cff 1px,
            transparent 1.7px
        );

    background-size:
        110px 110px,
        180px 180px;

    animation:stars 20s linear infinite;
}

/* LINKS */

.links{
    position:absolute;
    z-index:5;

    left:32.7%;
    width:34.8%;

    top:52.1%;
    height:39%;
}

/* INVISIBLE CLICK AREAS */

.hotspot{
    position:absolute;

    left:0;
    width:100%;
    height:12.4%;

    border-radius:12px;

    background:transparent;

    outline:none;
    cursor:pointer;

    transition:
        .22s ease;
}

/* HOVER EFFECT */

.hotspot:hover{
    background:
        rgba(150,40,255,.08);

    box-shadow:
        0 0 28px rgba(165,40,255,.45),
        inset 0 0 15px rgba(255,255,255,.04);

    transform:scale(1.015);
}

/* BUTTON POSITIONS */

.h1{
    top:0;
}

.h2{
    top:16.2%;
}

.h3{
    top:32.3%;
}

.h4{
    top:48.5%;
}

.h5{
    top:64.7%;
}

.h6{
    top:80.9%;
}

/* FOOTER */

.credit{
    position:absolute;

    z-index:6;

    bottom:1.8%;
    left:0;

    width:100%;

    text-align:center;

    color:
        rgba(255,255,255,.88);

    font-size:
        clamp(9px,1vw,14px);

    text-shadow:
        0 0 10px #7c21ff;

    pointer-events:none;
}

.credit span{
    color:#a33cff;
}

/* =========================
   ANIMATIONS
========================= */

@keyframes spaceMove{

    0%{
        transform:
            scale(1)
            translate3d(0,0,0);
    }

    100%{
        transform:
            scale(1.055)
            translate3d(-.6%,.4%,0);
    }
}

@keyframes stars{

    from{
        transform:
            translate(0,0)
            rotate(0);
    }

    to{
        transform:
            translate(140px,110px)
            rotate(2deg);
    }
}

/* =========================
   TABLET
========================= */

@media(max-width:900px){

    .art{
        object-position:center top;
    }

    .links{
        left:24%;
        width:52%;

        top:51.5%;
        height:40%;
    }
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .art{
        width:auto;
        height:100%;

        left:50%;

        transform:
            translateX(-50%);

        animation:
            mobileMove 12s ease-in-out infinite alternate;
    }

    .links{
        left:18%;
        width:64%;

        top:51%;
        height:40%;
    }

    .hotspot{
        border-radius:8px;
    }
}

@keyframes mobileMove{

    from{
        transform:
            translateX(-51%)
            scale(1.01);
    }

    to{
        transform:
            translateX(-49%)
            scale(1.045);
    }
}

/* REDUCE MOTION */

@media(prefers-reduced-motion:reduce){

    .art,
    .starfield{
        animation:none;
    }
}
</style>
</head>

<body>

<div class="site">

    <!--
    שים את התמונה בשם:
    background.png

    בתוך:
    assets/background.png
    -->

    <img
        class="art"
        src="assets/background.png"
        alt="NyRoXx RGS Links"
    >

    <div class="glow"></div>

    <div class="starfield"></div>


    <!-- LINKS -->

    <nav
        class="links"
        aria-label="Social links"
    >

        <!-- KICK -->

        <a
            class="hotspot h1"
            href="https://kick.com/1nyrox"
            target="_blank"
            rel="noopener"
            aria-label="Kick"
        ></a>


        <!-- YOUTUBE -->

        <a
            class="hotspot h2"
            href="https://www.youtube.com/@1NyRoXx"
            target="_blank"
            rel="noopener"
            aria-label="YouTube"
        ></a>


        <!-- TIKTOK -->

        <a
            class="hotspot h3"
            href="https://www.tiktok.com/@1nyroxx"
            target="_blank"
            rel="noopener"
            aria-label="TikTok"
        ></a>


        <!-- TWITCH -->

        <a
            class="hotspot h4"
            href="https://www.twitch.tv/1nyroxx"
            target="_blank"
            rel="noopener"
            aria-label="Twitch"
        ></a>


        <!-- INSTAGRAM -->

        <a
            class="hotspot h5"
            href="https://www.instagram.com/nyroxgg1/?hl=en"
            target="_blank"
            rel="noopener"
            aria-label="Instagram"
        ></a>


        <!-- DONATIONS -->

        <a
            class="hotspot h6"
            href="https://botrix.live/k/1nyrox/tip"
            target="_blank"
            rel="noopener"
            aria-label="Donations"
        ></a>

    </nav>


    <!-- FOOTER -->

    <div class="credit">
        © 2026
        <span>NyRoXx</span>.
        All rights reserved.
    </div>

</div>

</body>
</html>
